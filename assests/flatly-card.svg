<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">Flatly</title>
  <desc id="d">Flatly: shared living app for India. Find a flat or roommate, then live together with expenses, chores and house rules.</desc>
  <style>
    .f { font-family: 'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif; }
    .b { font-weight: 800; }
    .ink { fill: #111111; }
    .line { stroke: #111111; stroke-width: 3; }
  </style>

  <!-- background -->
  <rect width="1200" height="630" fill="#FFF8EC"/>
  <g fill="#111111" opacity="0.07">
    <circle cx="40" cy="40" r="3"/><circle cx="80" cy="40" r="3"/><circle cx="120" cy="40" r="3"/>
    <circle cx="1080" cy="590" r="3"/><circle cx="1120" cy="590" r="3"/><circle cx="1160" cy="590" r="3"/>
  </g>

  <!-- main card (hard shadow + body) -->
  <rect x="64" y="56" width="1072" height="518" rx="24" fill="#111111"/>
  <rect x="52" y="44" width="1072" height="518" rx="24" fill="#FFFFFF" class="line"/>

  <!-- logo mark -->
  <g transform="translate(96 84)">
    <rect x="6" y="6" width="84" height="84" rx="18" fill="#111111"/>
    <rect x="0" y="0" width="84" height="84" rx="18" fill="#FFD23F" class="line"/>
    <path d="M18 44 L42 22 L66 44" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M26 42 V64 H58 V42" fill="#FFF8EC" stroke="#111111" stroke-width="5" stroke-linejoin="round"/>
    <rect x="37" y="48" width="10" height="16" rx="2" fill="#FF6B57" stroke="#111111" stroke-width="3"/>
  </g>

  <!-- title block -->
  <text x="208" y="138" class="f b ink" font-size="64">Flatly</text>
  <text x="208" y="172" class="f ink" font-size="24" font-weight="600" opacity="0.75">Shared living app for India</text>

  <text x="96" y="262" class="f b ink" font-size="46">Dhundhne se rehne tak,</text>
  <text x="96" y="318" class="f b ink" font-size="46">sab ek jagah.</text>
  <rect x="96" y="330" width="272" height="10" rx="5" fill="#FFD23F"/>

  <!-- mode chips -->
  <g transform="translate(96 372)">
    <rect x="5" y="5" width="168" height="56" rx="14" fill="#111111"/>
    <rect width="168" height="56" rx="14" fill="#6EC6FF" class="line"/>
    <text x="84" y="37" text-anchor="middle" class="f b ink" font-size="24">FIND</text>
  </g>
  <g transform="translate(292 372)">
    <rect x="5" y="5" width="168" height="56" rx="14" fill="#111111"/>
    <rect width="168" height="56" rx="14" fill="#3DDC97" class="line"/>
    <text x="84" y="37" text-anchor="middle" class="f b ink" font-size="24">LIVE</text>
  </g>
  <text x="96" y="470" class="f ink" font-size="20" font-weight="600" opacity="0.75">Flat dhundho, roommate chuno,</text>
  <text x="96" y="498" class="f ink" font-size="20" font-weight="600" opacity="0.75">phir saath mein hisab-kitab sambhalo.</text>

  <!-- right: feature cards -->
  <!-- Expenses -->
  <g transform="translate(640 96)">
    <rect x="6" y="6" width="440" height="108" rx="16" fill="#111111"/>
    <rect width="440" height="108" rx="16" fill="#FFF8EC" class="line"/>
    <rect x="20" y="20" width="68" height="68" rx="14" fill="#3DDC97" class="line"/>
    <text x="54" y="66" text-anchor="middle" class="f b ink" font-size="38">₹</text>
    <text x="108" y="50" class="f b ink" font-size="28">Kaun kisko dega?</text>
    <text x="108" y="82" class="f ink" font-size="20" font-weight="600" opacity="0.7">Expense split + smart settle up</text>
  </g>
  <!-- Chores -->
  <g transform="translate(640 226)">
    <rect x="6" y="6" width="440" height="108" rx="16" fill="#111111"/>
    <rect width="440" height="108" rx="16" fill="#FFF8EC" class="line"/>
    <rect x="20" y="20" width="68" height="68" rx="14" fill="#FFD23F" class="line"/>
    <path d="M38 56 L50 68 L72 42" fill="none" stroke="#111111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="108" y="50" class="f b ink" font-size="28">Aaj ki baari</text>
    <text x="108" y="82" class="f ink" font-size="20" font-weight="600" opacity="0.7">Chore rotation + fairness stats</text>
  </g>
  <!-- Rules / AI -->
  <g transform="translate(640 356)">
    <rect x="6" y="6" width="440" height="108" rx="16" fill="#111111"/>
    <rect width="440" height="108" rx="16" fill="#FFF8EC" class="line"/>
    <rect x="20" y="20" width="68" height="68" rx="14" fill="#FF6B57" class="line"/>
    <path d="M54 34 L60 52 L78 58 L60 64 L54 82 L48 64 L30 58 L48 52 Z" fill="#FFFFFF" stroke="#111111" stroke-width="3" stroke-linejoin="round"/>
    <text x="108" y="50" class="f b ink" font-size="28">AI house rules</text>
    <text x="108" y="82" class="f ink" font-size="20" font-weight="600" opacity="0.7">Roommate match + shared rules</text>
  </g>

  <!-- stack strip -->
  <g transform="translate(640 486)" class="f b ink" font-size="18">
    <rect width="132" height="44" rx="12" fill="#FFFFFF" class="line"/><text x="66" y="29" text-anchor="middle">Next.js</text>
    <g transform="translate(148 0)"><rect width="132" height="44" rx="12" fill="#FFFFFF" class="line"/><text x="66" y="29" text-anchor="middle">FastAPI</text></g>
    <g transform="translate(296 0)"><rect width="132" height="44" rx="12" fill="#FFFFFF" class="line"/><text x="66" y="29" text-anchor="middle">Supabase</text></g>
  </g>
</svg>
